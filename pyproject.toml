[project]
name = "vector-vs-hybrid-search"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "chromadb>=1.0",
    "flask>=3.1.3",
    "google-genai>=2.8.0",
    "langchain>=0.3",
    "langchain-text-splitters>=0.3",
    "lxml>=5.0",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "rank-bm25>=0.2",
    "ranx>=0.3.21",
    "requests>=2.31",
    "seaborn>=0.13",
    "tqdm>=4.66",
]

[tool.pyright]
extraPaths = ["."]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.uv]
package = true
